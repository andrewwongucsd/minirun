# Records the README demo on a real kernel. Manual-only (workflow_dispatch):
# the demo is regenerated on request, not on every push.
#
# The runner is a real Linux box with root, so this runs the ACTUAL runtime --
# the recording is minirun creating namespaces, pivoting a rootfs, and being
# OOM-killed at a cgroup limit, not a mock-up. Recorded with asciinema (whose
# .cast is inspectable JSON) and rendered to a GIF with agg.
name: demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install busybox, asciinema, agg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static asciinema
          curl -sSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg && sudo mv /tmp/agg /usr/local/bin/agg
          agg --version

      - name: Build minirun and a rootfs
        run: |
          go build -o /usr/local/bin/minirun ./cmd/minirun
          minirun setup-rootfs ./rootfs

      - name: Sanity — run the demo once, plainly (output visible in the log)
        run: |
          sudo env "PATH=$PATH" bash docs/demo.sh
          echo "--- demo.sh exited $? ---"

      - name: Record with asciinema, then render a GIF
        run: |
          # asciinema allocates its own PTY, so no controlling terminal is
          # needed. Run as root because minirun needs it for namespaces/cgroups.
          sudo env "PATH=$PATH" asciinema rec docs/demo.cast \
            --overwrite --cols 84 --rows 22 \
            --command "bash docs/demo.sh"
          sudo chown "$USER" docs/demo.cast

          # Verify the cast actually captured the run before rendering — an empty
          # cast is a failure even though asciinema exits 0.
          echo "cast bytes: $(wc -c < docs/demo.cast)"
          grep -q 'own procfs' docs/demo.cast || { echo "cast is missing the demo output — capture failed"; exit 1; }

          agg --theme monokai --font-size 22 --speed 1.3 --idle-time-limit 2 \
            docs/demo.cast docs/demo.gif
          echo "gif bytes: $(wc -c < docs/demo.gif)"

      - name: Upload cast + gif
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            docs/demo.gif
            docs/demo.cast
